name: DUGA Governance Metadata

on:
  pull_request:
    paths:
      - "governance/**"
      - "migrations/**"
      - "docs/DUGA-SPEC.md"
      - "docs/AI-CONTINUITY/**"
      - "scripts/validate-governance.mjs"
      - "scripts/validate-migration-inventory.mjs"
      - "scripts/test-duga-schema.py"
      - "scripts/test-governance-health-api.mjs"
      - "functions/api/**"
      - ".github/workflows/duga-governance.yml"
  push:
    branches:
      - main
      - feature/full-admin-panel
    paths:
      - "governance/**"
      - "migrations/**"
      - "docs/DUGA-SPEC.md"
      - "docs/AI-CONTINUITY/**"
      - "scripts/validate-governance.mjs"
      - "scripts/validate-migration-inventory.mjs"
      - "scripts/test-duga-schema.py"
      - "scripts/test-governance-health-api.mjs"
      - "functions/api/**"
      - ".github/workflows/duga-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-governance:
    name: Validate governance metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check API JavaScript syntax
        run: |
          node --check "functions/api/[[path]].js"
      - name: Test Owner-only DUGA health API
        run: node scripts/test-governance-health-api.mjs
      - name: Validate registry, ownership and dependencies
        run: node scripts/validate-governance.mjs
      - name: Validate D1 migration inventory (static only)
        run: node scripts/validate-migration-inventory.mjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test DUGA schema draft in in-memory SQLite
        run: python scripts/test-duga-schema.py
