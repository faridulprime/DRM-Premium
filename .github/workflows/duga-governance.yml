name: DUGA Governance Metadata

on:
  pull_request:
    paths:
      - "governance/**"
      - "migrations/**"
      - "docs/DUGA-SPEC.md"
      - "docs/AI-CONTINUITY/**"
      - "scripts/validate-governance.mjs"
      - "scripts/validate-migration-inventory.mjs"
      - ".github/workflows/duga-governance.yml"
  push:
    branches:
      - main
      - feature/full-admin-panel
    paths:
      - "governance/**"
      - "docs/DUGA-SPEC.md"
      - "docs/AI-CONTINUITY/**"
      - "scripts/validate-governance.mjs"
      - ".github/workflows/duga-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-governance:
    name: Validate governance metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate registry, ownership and dependencies
        run: node scripts/validate-governance.mjs
      - name: Validate D1 migration inventory (static only)
        run: node scripts/validate-migration-inventory.mjs
