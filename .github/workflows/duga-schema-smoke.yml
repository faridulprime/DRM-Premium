name: DUGA schema smoke test

on:
  push:
    branches:
      - feature/full-admin-panel
      - duga-foundation-review
    paths:
      - "governance/**"
      - "docs/DUGA-*.md"
      - "docs/AI-CONTINUITY/**"
      - "scripts/test-duga-schema.py"
      - "scripts/validate-duga-registries.py"
      - "scripts/test-duga-validator.py"
      - "scripts/duga-d1-acceptance-worker/**"
      - "scripts/duga-d1-disposable-acceptance-fixture.sql"
      - "scripts/duga-d1-disposable-acceptance-console.sql"
      - "scripts/test-duga-fixture-sync.py"
      - "scripts/test-duga-target-registry.py"
      - "docs/DUGA-D1-TARGET-REGISTRY.md"
      - "docs/DUGA-API-INTEGRATION-READINESS.md"
      - "scripts/duga-d1-acceptance-worker/README.md"
      - "scripts/duga-d1-acceptance-worker/wrangler.toml"
      - "scripts/duga-d1-revised-gap-probes.sql"
      - ".github/workflows/duga-schema-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - "governance/**"
      - "scripts/test-duga-schema.py"
      - "scripts/validate-duga-registries.py"
      - "scripts/duga-d1-acceptance-worker/**"
      - "scripts/duga-d1-disposable-acceptance-fixture.sql"
      - "scripts/duga-d1-disposable-acceptance-console.sql"
      - "scripts/test-duga-fixture-sync.py"
      - "scripts/test-duga-target-registry.py"
      - "docs/DUGA-D1-TARGET-REGISTRY.md"
      - "docs/DUGA-API-INTEGRATION-READINESS.md"
      - "scripts/duga-d1-acceptance-worker/README.md"
      - "scripts/duga-d1-acceptance-worker/wrangler.toml"
      - "scripts/duga-d1-revised-gap-probes.sql"
      - ".github/workflows/duga-schema-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check disposable D1 Worker syntax
        run: node --check scripts/duga-d1-acceptance-worker/src/index.js

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run local schema smoke tests
        run: |
          python scripts/test-duga-schema.py
          python scripts/test-duga-fixture-sync.py
          python scripts/test-duga-target-registry.py
          python scripts/validate-duga-registries.py
          python scripts/test-duga-validator.py
