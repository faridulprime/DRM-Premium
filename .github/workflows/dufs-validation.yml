name: DUFS Folder System Validation

on:
  push:
    branches:
      - feature/full-admin-panel
    paths:
      - "assets/dufs/**"
      - "assets/dumc/**"
      - "assets/dulm/**"
      - "index.html"
      - "app.js"
      - "functions/api/[[path]].js"
      - "dufs-manager.js"
      - "dumc-manager.js"
      - "upload-studio.html"
      - "upload-studio.js"
      - "migrations/0009_dumc_movie_library.sql"
      - "migrations/0010_dumc_release_years_1956_1959.sql"
      - "migrations/manifest.json"
      - "scripts/test-dumc-migration.py"
      - "docs/DUFS-SPEC.md"
      - ".github/workflows/dufs-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "assets/dufs/**"
      - "assets/dumc/**"
      - "assets/dulm/**"
      - "index.html"
      - "app.js"
      - "functions/api/[[path]].js"
      - "dufs-manager.js"
      - "dumc-manager.js"
      - "upload-studio.html"
      - "upload-studio.js"
      - "migrations/0009_dumc_movie_library.sql"
      - "migrations/0010_dumc_release_years_1956_1959.sql"
      - "migrations/manifest.json"
      - "scripts/test-dumc-migration.py"
      - "docs/DUFS-SPEC.md"
      - ".github/workflows/dufs-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dufs-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate DUFS migration, taxonomy and system compatibility
        run: python scripts/test-dumc-migration.py
      - name: Validate DUFS and application JavaScript syntax
        run: node --input-type=module --check < 'functions/api/[[path]].js' && node --check assets/dufs/folder-system.js && node --check assets/dufs/home.js && node --check assets/dulm/list-manager.js && node --check dufs-manager.js && node --check upload-studio.js && node --check app.js
