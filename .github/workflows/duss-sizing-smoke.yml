name: DRM System Validation

on:
  push:
    branches:
      - feature/full-admin-panel
    paths:
      - "assets/sizing/tokens.css"
      - "assets/sizing/touch-targets.css"
      - "theme.css"
      - "styles.css"
      - "admin.css"
      - "live-users.css"
      - "upload-studio.css"
      - "profile.css"
      - "index.html"
      - "admin.html"
      - "live-users.html"
      - "upload-studio.html"
      - "profile.html"
      - "docs/DUSS-SPEC.md"
      - "scripts/test-duss-tokens.py"
      - "assets/dufs/**"
      - "assets/dumc/**"
      - "assets/dulm/**"
      - "functions/api/[[path]].js"
      - "dufs-manager.js"
      - "dumc-manager.js"
      - "upload-studio.js"
      - "scripts/test-dumc-migration.py"
      - "docs/DUFS-SPEC.md"
      - ".github/workflows/dufs-validation.yml"
      - ".github/workflows/duss-sizing-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - "assets/sizing/tokens.css"
      - "assets/sizing/touch-targets.css"
      - "theme.css"
      - "styles.css"
      - "admin.css"
      - "live-users.css"
      - "upload-studio.css"
      - "profile.css"
      - "index.html"
      - "admin.html"
      - "live-users.html"
      - "upload-studio.html"
      - "profile.html"
      - "docs/DUSS-SPEC.md"
      - "scripts/test-duss-tokens.py"
      - ".github/workflows/duss-sizing-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sizing-source-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate DUSS sizing tokens and consumers
        run: python scripts/test-duss-tokens.py

      - name: Validate DUFS migration and canonical folder contract
        run: python scripts/test-dumc-migration.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate DUFS and application JavaScript syntax
        run: node --input-type=module --check < 'functions/api/[[path]].js' && node --check assets/dufs/folder-system.js && node --check assets/dufs/home.js && node --check assets/dulm/list-manager.js && node --check dufs-manager.js && node --check upload-studio.js && node --check app.js
